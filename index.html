<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dawg Quiz</title>
<style>
:root{--bg:#2a1a12;--bg1:#3d2214;--bg2:#1f130c;--card:#38241a;--text:#fbeedd;--muted:#d2b698;--accent:#ff9248;--btn-text:#2a1a12;--warn:#ff7a63;--line:#7a553d}
@media (prefers-color-scheme: light){:root{--bg:#fbe9cf;--bg1:#fcd6a0;--bg2:#fbeed8;--card:#fff8ec;--text:#3b2416;--muted:#8a6548;--accent:#c9531a;--btn-text:#fff;--warn:#b3382c;--line:#d9b88f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;color:var(--text);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:560px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 6px 28px rgba(60,25,5,.25)}
h1{margin:0 0 8px;font-size:26px}
p{color:var(--muted);line-height:1.5}
input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--text);font-size:16px;margin:8px 0}
button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;background:var(--accent);color:var(--btn-text);font-size:16px;cursor:pointer;text-align:left}
button.center{text-align:center}
button:disabled{opacity:.5;cursor:default}
.count{font-size:14px;color:var(--muted);margin-bottom:8px}
.timer{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:6px;opacity:.9}
.timer div{height:100%;background:var(--accent);width:100%}
.timer.low div{background:var(--warn)}
.secs{text-align:right;font-size:13px;color:var(--muted)}
.emote{display:block;width:150px;max-width:60%;margin:10px auto 4px;background:#fff;border-radius:12px;padding:8px}
.emote.px{image-rendering:pixelated;max-width:none;background:#f6e6cc}
.note{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;margin-top:14px;min-height:92px;color:var(--muted)}
.stk{height:80px;width:auto;flex:none;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.note .stk{height:84px}
.stk.big{display:block;height:150px;margin:6px auto 4px}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.hd-l{flex:1;min-width:0}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.item .price{float:right;font-weight:700;color:var(--accent)}
.item .small{font-size:13px;color:var(--muted);margin-top:2px}
.sh{margin:22px 0 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
.wr{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:0 14px}
.wr summary{cursor:pointer;padding:13px 0;font-weight:700;color:var(--accent);list-style:none}
.wr summary::-webkit-details-marker{display:none}
.wr summary::before{content:"\25B8  "}
.wr[open] summary::before{content:"\25BE  "}
.wr[open] summary{border-bottom:1px solid var(--line)}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rq{font-weight:700;margin:2px 0 6px}
.ra,.rc{font-size:14px;color:var(--muted);margin-top:2px}
.rvimg{display:block;height:60px;width:auto;margin-bottom:6px;border-radius:8px;background:#fff;padding:3px}
.rvimg.px{image-rendering:pixelated}
.hero{display:block;width:100%;max-width:400px;margin:0 auto 16px;border-radius:16px;box-shadow:0 8px 22px rgba(60,25,5,.35)}
.title{text-align:center;margin:0 0 2px}
.sub{text-align:center;margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.leaves span{position:absolute;top:-10vh;opacity:.7;animation:fall linear infinite;will-change:transform}
@keyframes fall{from{transform:translate3d(0,-10vh,0) rotate(0deg)}to{transform:translate3d(var(--dx,40px),115vh,0) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.leaves{display:none}}
.score{font-size:52px;font-weight:700;text-align:center;margin:12px 0}
.code{font-family:monospace;font-size:18px;text-align:center;letter-spacing:1px;padding:12px;border:2px dashed var(--accent);border-radius:10px;word-break:break-word}
</style>
</head>
<body>
<div class="leaves" id="leaves" aria-hidden="true"></div>
<div class="wrap"><div class="card" id="app"></div></div>

<script>
/* ============ EDIT THIS SECTION ============ */
const POINTS = 100;      // Dawg Social Credits per right answer (a close typed answer earns half)
const SECONDS = 30;       // time per question
const WRONG_MSGS = [         // shown after a wrong answer
  "Oof...", "Yikes.", "Bruh.", "Not quite, chief.", "Wow. Really?",
  "Bold choice. Wrong, but bold.", "The Dawgs are disappointed.",
  "Incorrect. Painfully.", "Hmm. No.", "That was hard to watch.", "Ouch."
];
const HALF_MSGS = [          // close typed answer (half credit); {n} becomes the credits earned
  "Close, but not quite right. You get {n} social credits.",
  "So close, but not quite. {n} social credits.",
  "Almost, but not quite right. {n} credits for effort.",
  "Close but no cigar. {n} social credits.",
  "Not quite right, but close enough for {n} social credits."
];
const RIGHT_MSGS = [         // shown after a right answer
  "Correct.", "Nice.", "Okay, you know your Dawgs.", "Alright, alright.",
  "Correct. Don't let it go to your head."
];
// Shop. Prizes with a pct are priced as a share (pct) of the maximum credits, so they scale with the number of questions.
// With 40 questions (4,000 max): 4,000 / 3,400 / 2,550 / 1,500 / 800. A perfect score can't stack prizes (3,400 + 800 and 2,550 + 1,500 both top 4,000).
// Extras use a fixed price.
// Rules: one NX prize per person, every item once, tap an item again to undo it.
const SHOP_ROUND = 50;       // percentage prices round to the nearest 50
const SHOP = [
  { id: "nx50", name: "50k NX", pct: 100, nx: true, note: "Only a perfect quiz can afford this." },
  { id: "nx30", name: "30k NX", pct: 85, nx: true, note: "For a really strong run." },
  { id: "nx10", name: "10k NX coupon", pct: 64, nx: true, note: "For a decent run." },
  { id: "emote", name: "An emote dedicated to you", pct: 38, note: "Your very own emote in the server." },
  { id: "role", name: "Your own special role colour", pct: 20, note: "A role colour that is yours alone." },
  { id: "to1h", name: "Timeout Jums for 1 hour", price: 500, extra: true, note: "Jums sits in the corner for an hour." },
  { id: "to10", name: "Timeout Jums for 10 minutes", price: 200, extra: true, note: "Jums sits in the corner for 10 minutes." },
  { id: "to5", name: "Timeout Jums for 5 minutes", price: 50, extra: true, note: "Jums sits in the corner for 5 minutes." }
];
const RETAKE_CODE = "ch33";  // code needed to unlock a retake
const RETAKE_TAUNTS = [      // shown in order when the retake code is wrong
  "Wrong. Did you really think you could just retake it? Embarrassing.",
  "Nope. Your score is your score. Live with it.",
  "Nice try, but no take-backs. The Dawgs are laughing at you.",
  "Still wrong. Maybe put that effort into the actual questions next time.",
  "Trying to retake the quiz AND failing the retake code. Peak performance."
];
const RUN_LENGTH = 99;    // questions per player from the pool (99 = all of them, in random order)

// Q(question, options, correctIndex = 0, fixedOrder = false). Options shuffle unless fixedOrder is true.
const Q = (q, o, a = 0, fixed = false) => ({ q, o, a, fixed });
const POOL = [
  Q("Violet's main IGN consists of how many i's?", ["1","2","3","4"], 1, true),
  { q: "What is the IGN of Violet's Shade?", text: true, accept: ["fioweh"], show: "fIoweh", fuzzy: 0, max: 20 },
  Q("Tyler's Kanna's IGN used to be what?", ["IKannaNotSry","KannaNotSry","It was always Juno"]),
  Q("What is the name of Dae's dog?", ["Boba","Umi","Mochi"]),
  Q("When Rodney has to leave unexpectedly, this is what he says:", ["KIGB","FUDB","vibye"]),
  Q("When Smear encountered a rabbit while driving, what did he do?", ["He ran over it with his car","He swerved to avoid it","He stopped and waited until it crossed"]),
  Q("Before Mr Sniffa, Andrew was known as:", ["Mr Snickers","Mr Sniffer","Mr Sniper"]),
  Q("Which of these games has Violet never played?", ["Guild Wars 2","Nikke","Honkai Star Rail","Genshin Impact"]),
  Q("Name of Jason's Ren:", ["enola","ebola","enalo"]),
  Q("Tommy often prefixes his characters with what?", ["Hyu","Hyuu","Hyoo"]),
  Q("Dym's pink rabbit avatar was drawn by which artist?", ["Kanahei","Nagano","She drew it herself"]),
  Q("Chiikawa is what animal?", ["Hamster","Bear","Cat"]),
  Q("Aing often sits comfortably here:", ["Henesys ch 30","Tallahart ch 30","Henesys ch 33"]),
  Q("Asley's dog's name:", ["Chloe","Clover","Cleo"]),
  Q("James is depicted as what in his avatar?", ["A chicken drumstick","A yellow blob","A normal bird"]),
  Q("Kogei's MapleCon experience was:", ["Horrible and he never wants to go there again","Great, his flight was on time and he enjoyed every minute of it","Okay, since at least he got to see Elastico in person"]),
  Q("Dymbro is Dym's...", ["Little brother","Big brother","Sister"]),
  Object.assign(Q("PK's emote ROMU stands for:", ["Return On Michelob Ultra","Round Of Michelob Ultras","Refill On Michelob Ultra"]), { img: "romu", w: 200 }),
  Q("Nate has in recent months started playing:", ["Mahjong","Shogi","Backgammon"]),
  Q("Pookie enjoys defeating old grannies at this game:", ["Pickleball","Tennis","Ping pong"]),
  Q("What is Pookie's new car?", ["Honda Fit","Honda Accord","Honda Civic"]),
  Q("Tei lives in this part of Vietnam:", ["North","Central","South"], 0, true),
  Q("This food item sent Tyler to the bathroom almost immediately at Costco:", ["Chicken bake","Pizza","Sundae"]),
  Q("Although Ming is Quebecois, he is also:", ["Italian","Chinese","French"]),
  Q("How many Canadian Dawgs live in Canada?", ["3","4","5"], 2, true),
  Q("How many Australian Dawgs are there?", ["1","2","3"], 1, true),
  Q("Alec's profile pic is from:", ["Fire Emblem","Persona 5","Xenoblade Chronicles"]),
  Q("What colour are Kogei's cats?", ["Orange","Black","Brown"], 0, true),
  { q: "One of Scott's characters had an inappropriate IGN that Nexon changed to what?", text: true, accept: ["basilsnobby"], fuzzy: 2, max: 20 },
  Q("Dym's second main:", ["Zero","Erel","Shade"]),
  Q("Eric may be a bishop but in Dawgers he is:", ["a minority","the least casual","fashionable"]),
  Q("Which of these statements is true?", ["Tyler built a discord bot called Vibot","Dym built a discord bot called M'Lord of the carrots","MapleDoro is a discord bot unaffiliated with any of the Dawgs"]),
  Q("How many Dawgs live in BC?", ["1","2","3"], 1, true),
  // Name that emote: free-form, max 20 characters, fuzzy match (fuzzy = typos allowed; image lives in IMAGES at the bottom)
  { q: "Name that emote!", text: true, img: "naruhodo", accept: ["naruhodo"], fuzzy: 1, max: 20 },
  // Name that guild: same idea; scale = how many times to enlarge the tiny pixel icon
  { q: "Name that guild!", text: true, img: "swimteam", scale: 4, accept: ["swimteam"], fuzzy: 1, max: 20 },
  { q: "Name that guild!", text: true, img: "refugee", scale: 9, accept: ["refugee"], fuzzy: 1, max: 20 },
  { q: "Name this chicken!", text: true, img: "poinko", accept: ["poinko"], contains: true, fuzzy: 1, max: 20 },
  { q: "Who's that Pokemon?", text: true, img: "charmander", accept: ["charmander"], fuzzy: 2, max: 20 }
];
// The last two questions for everyone: the Mountain time zone count, then the free-form bonus.
const GATE = Object.assign(Q("How many Dawgs live in the Mountain time zone?", ["1","2","3"], 0, true), { gate: true });
const BONUS = { q: "Which Dawg lives in the Mountain time zone?", text: true, accept: ["dym","dymmy","dymium","diem"], show: "Dym" };
/* ============================================ */

const app = document.getElementById("app");
const KEY = "dawg-quiz-result-v6";
let runLog = [], res = null, armed = null, lastAgain = false, lastThink = "", name = "", i = 0, correct = 0, plan = [], timerId = null, deadline = 0, total = 0;

// block the back button (best effort)
history.pushState(null, "", location.href);
addEventListener("popstate", () => history.pushState(null, "", location.href));
addEventListener("beforeunload", e => { if (plan.length && i < plan.length) { e.preventDefault(); e.returnValue = ""; } });

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){ a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }

function norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9]/g, ""); }
// edit distance where swapping two neighbouring letters counts as one typo
function dist(a, b){
  const d = [];
  for (let x = 0; x <= a.length; x++) d[x] = [x];
  for (let y = 1; y <= b.length; y++) d[0][y] = y;
  for (let x = 1; x <= a.length; x++) for (let y = 1; y <= b.length; y++) {
    d[x][y] = Math.min(d[x-1][y] + 1, d[x][y-1] + 1, d[x-1][y-1] + (a[x-1] === b[y-1] ? 0 : 1));
    if (x > 1 && y > 1 && a[x-1] === b[y-2] && a[x-2] === b[y-1]) d[x][y] = Math.min(d[x][y], d[x-2][y-2] + 1);
  }
  return d[a.length][b.length];
}
// spot on = the exact answer (capitals and stray punctuation at the ends ignored; a space or symbol inside the word counts as a typo)
function exactKey(s){ return String(s).toLowerCase().trim().replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, ""); }
// 1 = spot on, 0.5 = close (within the question's typo allowance), 0 = wrong
function grade(Qn, input){
  const v = norm(input);
  if (!v) return 0;
  const k = exactKey(input);
  if (Qn.accept.some(a => k === exactKey(a))) return 1;
  if (Qn.contains && Qn.accept.some(a => v.includes(norm(a)))) return 1;   // contains: the answer counts if it has the name anywhere inside
  return Qn.fuzzy > 0 && Qn.accept.some(a => dist(v, norm(a)) <= Qn.fuzzy) ? 0.5 : 0;
}

function start(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (saved) { res = saved; res.bought = Array.isArray(res.bought) ? res.bought.filter(id => item(id)) : []; return showResult(true); }
  const n = Math.min(RUN_LENGTH, POOL.length) + 2;
  app.innerHTML = `
    <img class="hero" src="${COVER}" alt="A plush Dawg in a red scarf standing in an autumn park">
    <h1 class="title">The Dawg Quiz</h1>
    <div class="sub">Autumn edition</div>
    <p>${n} questions of Dawg lore, ${SECONDS} seconds each. If time runs out, it counts as wrong. You can't go back, and it's one try per person.</p>
    <p>Every right answer earns ${POINTS} Dawg Social Credits. Typed answers that are close but not spot on earn ${POINTS / 2}. Your final balance is shown at the end, and you can spend it in the shop.</p>
    <input id="nm" maxlength="32" placeholder="Your Discord username">
    <button class="center" id="go">Start</button>`;
  document.getElementById("go").onclick = () => {
    const v = document.getElementById("nm").value.trim();
    if (!v) return document.getElementById("nm").focus();
    name = v; i = 0; correct = 0; runLog = [];
    plan = shuffle(POOL).slice(0, RUN_LENGTH).concat([GATE, BONUS]);
    total = plan.length;
    ask();
  };
}

function ask(){
  const Qn = plan[i];
  let body, opts = [];
  const pic = Qn.img ? `<img class="emote${Qn.scale ? " px" : ""}" src="${IMAGES[Qn.img]}" alt="Image for this question"${Qn.scale ? ` onload="this.style.width=(this.naturalWidth*${Qn.scale})+'px'"` : ""}${Qn.w ? ` style="width:${Qn.w}px"` : ""}>` : "";
  if (Qn.text) {
    body = pic +
      `<input id="ft" maxlength="${Qn.max || 60}" placeholder="Type your answer" autocomplete="off"><button class="center" id="sub">Submit</button>`;
  } else {
    opts = Qn.o.map((t, idx) => ({ t, ok: idx === Qn.a }));
    if (!Qn.fixed) opts = shuffle(opts);
    body = pic + `<div id="opts">${opts.map((o, k) => `<button data-k="${k}">${esc(o.t)}</button>`).join("")}</div>`;
  }
  let qs; do { qs = pick(STK_SETS.think); } while (qs === lastThink); lastThink = qs;
  app.innerHTML = `
    <div class="hd"><div class="hd-l">
      <div class="count">Question ${i + 1} of ${total}</div>
      <div class="timer" id="tb"><div id="tf"></div></div>
      <div class="secs" id="ts">${SECONDS}s</div></div>
      <img class="stk" id="qs" src="${STK[qs]}" alt=""></div>
    <h1 style="font-size:21px;margin-top:10px">${esc(Qn.q)}</h1>
    ${body}
    <div class="note" id="nt"></div>`;
  let done = false;
  const finish = (pts, msg, given) => {
    if (done) return; done = true;
    const timedOut = !!msg;
    runLog.push({ q: Qn.q, img: Qn.img || "", sc: Qn.scale || 0, g: given || "", t: timedOut, p: pts, a: Qn.text ? (Qn.show || Qn.accept[0]) : Qn.o[Qn.a] });
    clearInterval(timerId);
    app.querySelectorAll("button,input").forEach(b => b.disabled = true);
    correct += pts * POINTS;
    if (!msg) {
      msg = pick(pts === 1 ? RIGHT_MSGS : pts > 0 ? HALF_MSGS : WRONG_MSGS).replace("{n}", pts * POINTS);
      if (pts === 1) msg += " +" + POINTS + " social credits";
    }
    const sk = timedOut ? "sleep" : pick(pts === 1 ? STK_SETS.right : pts > 0 ? STK_SETS.half : STK_SETS.wrong);
    const nt = document.getElementById("nt");
    nt.innerHTML = `<img class="stk" src="${STK[sk]}" alt=""><span>${esc(msg)}</span>`;
    nt.style.color = pts === 1 ? "var(--accent)" : "var(--warn)";
    setTimeout(next, 1700);
  };
  if (Qn.text) {
    const go = () => { const v = document.getElementById("ft").value; finish(grade(Qn, v), null, v); };
    document.getElementById("sub").onclick = go;
    document.getElementById("ft").onkeydown = e => { if (e.key === "Enter") go(); };
    document.getElementById("ft").focus();
  } else {
    app.querySelectorAll("#opts button").forEach(b => {
      b.onclick = () => finish(opts[+b.dataset.k].ok ? 1 : 0, null, opts[+b.dataset.k].t);
    });
  }
  let hurried = false;
  deadline = Date.now() + SECONDS * 1000;
  timerId = setInterval(() => {
    const left = Math.max(0, deadline - Date.now());
    document.getElementById("tf").style.width = (left / (SECONDS * 1000) * 100) + "%";
    document.getElementById("ts").textContent = Math.ceil(left / 1000) + "s";
    document.getElementById("tb").classList.toggle("low", left < 8000);
    if (left < 8000 && !hurried) { hurried = true; if (!done) document.getElementById("qs").src = STK[pick(STK_SETS.hurry)]; }
    if (left <= 0) finish(0, "Time's up. Did you fall asleep?");
  }, 100);
}

function next(){
  i++;
  if (i >= plan.length) return end();
  ask();
}

function save(){ try { localStorage.setItem(KEY, JSON.stringify(res)); } catch (e) {} }
function end(){
  res = { name, score: correct, total, bought: [], log: runLog };
  save();
  plan = [];
  showResult(false);
}

const item = id => SHOP.find(x => x.id === id);
const priceOf = (it, tot) => it.price || Math.round(tot * POINTS * it.pct / 100 / SHOP_ROUND) * SHOP_ROUND;
const othersSpent = r => r.bought.filter(id => id !== "gift").reduce((a, id) => a + priceOf(item(id), r.total), 0);
const giftAmt = r => r.bought.includes("gift") ? r.score - othersSpent(r) : 0;
const spentOf = r => othersSpent(r) + giftAmt(r);

const RK = "dawg-quiz-retakes-v1";   // kept apart from the quiz result so it survives a retake
function rkGet(){ try { return JSON.parse(localStorage.getItem(RK)) || { fails: 0, used: 0 }; } catch (e) { return { fails: 0, used: 0 }; } }
function rkBump(k){ const r = rkGet(); r[k] = (r[k] || 0) + 1; try { localStorage.setItem(RK, JSON.stringify(r)); } catch (e) {} }
function rkHtml(){
  const r = rkGet(), t = [];
  if (r.used) t.push("Retook the quiz " + r.used + (r.used === 1 ? " time" : " times") + ", so this may not be their first run.");
  if (r.fails) t.push("Tried to retake the quiz and failed the retake code " + r.fails + (r.fails === 1 ? " time" : " times") + (r.fails >= 3 ? ". Persistent." : ". Embarrassing."));
  return t.length ? '<div style="margin:6px 0;color:var(--warn);font-weight:700">' + t.map(esc).join("<br>") + "</div>" : "";
}
function updateRk(){ const el = document.getElementById("rkn"); if (el) el.innerHTML = rkHtml(); }

function retakeHtml(){
  return `<button class="center" id="rt" style="background:transparent;border:2px solid var(--line);color:var(--muted);margin-top:12px">Retake quiz</button><div id="rtbox"></div>`;
}
function bindRetake(){
  let tries = 0;
  document.getElementById("rt").onclick = () => {
    document.getElementById("rt").style.display = "none";
    document.getElementById("rtbox").innerHTML = `<p>Enter the retake code:</p><input id="rtc" autocomplete="off" placeholder="Retake code"><button class="center" id="rtg">Unlock</button><div class="note" id="rtn" style="color:var(--warn)"></div>`;
    const go = () => {
      if (norm(document.getElementById("rtc").value) === norm(RETAKE_CODE)) { rkBump("used"); try { localStorage.removeItem(KEY); } catch (x) {} start(); return; }
      rkBump("fails"); updateRk();
      document.getElementById("rtn").innerHTML = `<img class="stk" src="${STK[pick(STK_SETS.taunt)]}" alt=""><span>${esc(RETAKE_TAUNTS[tries++ % RETAKE_TAUNTS.length])}</span>`;
      document.getElementById("rtc").value = "";
    };
    document.getElementById("rtg").onclick = go;
    document.getElementById("rtc").onkeydown = e => { if (e.key === "Enter") go(); };
    document.getElementById("rtc").focus();
  };
}

function showResult(again){
  if (res.done) return showReceipt();
  lastAgain = again;
  const n = res.name, score = res.score, tot = res.total, spent = spentOf(res), bal = score - spent;
  const pct = score / (tot * POINTS);
  const sk = pick(pct >= 0.9 ? STK_SETS.top : pct >= 0.7 ? STK_SETS.good : pct >= 0.4 ? STK_SETS.mid : STK_SETS.low);
  app.innerHTML = `
    <img class="stk big" src="${STK[sk]}" alt="">
    <h1 style="text-align:center">Quiz complete</h1>
    <p>${again ? "You already took the quiz, " : "Nice one, "}${esc(n)}.</p>
    <div class="score">${bal.toLocaleString()}</div>
    <p style="text-align:center;margin-top:-8px">Dawg Social Credits<br><small>earned ${score.toLocaleString()} of ${(tot * POINTS).toLocaleString()}${spent ? " &middot; spent " + spent.toLocaleString() : ""}</small></p>
    <p>Spend your credits in the shop. When you're done you get a receipt to post in the server and tag Dym to claim your prizes, and you can see which answers you got wrong.</p>
    <button class="center" id="sp" style="margin-top:20px">Spend credits</button>
    ${retakeHtml()}`;
  document.getElementById("sp").onclick = () => { armed = null; showShop(); };
  bindRetake();
}

function showShop(msg){
  const others = othersSpent(res), bal = res.score - spentOf(res);
  const hasNx = res.bought.some(id => item(id).nx);
  const row = it => {
    const sel = res.bought.includes(it.id);
    const avail = res.score - others;                       // what the gift would move
    const price = it.gift ? avail : priceOf(it, res.total);
    let btn;
    if (sel) btn = `<button class="center" data-t="${it.id}" style="background:transparent;border:2px solid var(--accent);color:var(--accent)">Selected. Tap to undo</button>`;
    else if (it.gift && avail <= 0) btn = `<button class="center" disabled>No credits left to donate</button>`;
    else if (it.gift) btn = `<button class="center" data-t="${it.id}">Donate ${avail.toLocaleString()}</button>`;
    else if (it.nx && hasNx) btn = `<button class="center" disabled>One NX prize per person</button>`;
    else if (bal < price) btn = `<button class="center" disabled>Need ${(price - bal).toLocaleString()} more</button>`;
    else btn = `<button class="center" data-t="${it.id}">Buy for ${price.toLocaleString()}</button>`;
    const who = it.gift && sel ? `<input id="gt" maxlength="32" placeholder="Who are you donating to? (Discord username)" autocomplete="off" value="${esc(res.giftTo || "")}">` : "";
    return `<div class="item"><span class="price">${it.gift ? "All remaining" : price.toLocaleString()}</span><b>${esc(it.name)}</b><div class="small">${esc(it.note)}</div>${who}${btn}</div>`;
  };
  app.innerHTML = `
    <img class="stk big" src="${STK.hat}" alt="">
    <h1 style="text-align:center">Dawg Social Credit Shop</h1>
    <div class="score">${bal.toLocaleString()}</div>
    <p style="text-align:center;margin-top:-8px">credits to spend<br><small>One NX prize per person. Tap an item again to undo it.</small></p>
    ${msg ? `<div class="note" style="color:var(--warn)"><img class="stk" src="${STK.unimpressed}" alt=""><span>${esc(msg)}</span></div>` : ""}
    <div class="sh">Prizes</div>
    ${SHOP.slice().sort((a, b) => priceOf(b, res.total) - priceOf(a, res.total)).map(row).join("")}
    <button class="center" id="dn" style="margin-top:26px">${armed === "done" ? "Confirm: I'm done shopping" : "Done shopping: get my receipt"}</button>
    <p style="font-size:13px;margin:6px 0 0">Your receipt shows up next, with the answers you got wrong. You can't shop after that.</p>
    <button class="center" id="bk" style="background:transparent;border:2px solid var(--line);color:var(--muted);margin-top:12px">Back to results</button>`;
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const id = b.dataset.t, k = res.bought.indexOf(id);
    if (k >= 0) res.bought.splice(k, 1); else res.bought.push(id);
    armed = null; save(); showShop();
  });
  const gt = document.getElementById("gt");
  if (gt) { gt.oninput = () => { res.giftTo = gt.value; save(); }; if (!(res.giftTo || "").trim()) gt.focus(); }
  document.getElementById("dn").onclick = () => {
    if (res.bought.includes("gift") && !(res.giftTo || "").trim()) { armed = null; return showShop("Who are you donating your credits to? Type their name first."); }
    if (armed !== "done") { armed = "done"; return showShop(msg); }
    armed = null; res.done = true; res.doneAt = new Date().toLocaleString(); save(); showReceipt();
  };
  document.getElementById("bk").onclick = () => { armed = null; showResult(lastAgain); };
}

function showReceipt(){
  const spent = spentOf(res), bal = res.score - spent, max = res.total * POINTS;
  const lines = res.bought.map(id => {
    const it = item(id);
    const nm = it.gift ? "Donated my remaining credits to " + esc((res.giftTo || "someone").trim()) : esc(it.name);
    const amt = it.gift ? giftAmt(res) : priceOf(it, res.total);
    return `<div style="display:flex;justify-content:space-between;gap:12px"><span>${nm}</span><span>${amt.toLocaleString()}</span></div>`;
  }).join("");
  const wrong = (res.log || []).filter(e => e.p < 1);
  const rv = wrong.map(e => `
    <div class="rv">
      ${e.img ? `<img class="rvimg${e.sc ? " px" : ""}" src="${IMAGES[e.img]}" alt="">` : ""}
      <div class="rq">${esc(e.q)}</div>
      <div class="ra">Your answer: <b>${e.g ? esc(e.g) : (e.t ? "no answer (time ran out)" : "blank")}</b>${e.p > 0 ? " &middot; close, half credit" : ""}</div>
      <div class="rc">Correct answer: <b>${esc(e.a)}</b></div>
    </div>`).join("");
  const sk = res.bought.length ? "party" : pick(STK_SETS.low);
  app.innerHTML = `
    <img class="stk big" src="${STK[sk]}" alt="">
    <h1 style="text-align:center">Your receipt</h1>
    <div class="code" style="text-align:left;letter-spacing:0;font-size:15px">
      <div><b>Dawg Social Credit Shop</b></div>
      <div id="rkn">${rkHtml()}</div>
      <div>${esc(res.name)} &middot; ${esc(res.doneAt || "")}</div>
      <hr>
      <div>Credits earned: ${res.score.toLocaleString()} / ${max.toLocaleString()}</div>
      ${lines || "<div>No purchases</div>"}
      <hr>
      <div>Total spent: ${spent.toLocaleString()}</div>
      <div>Balance: ${bal.toLocaleString()}</div>
    </div>
    <p>${res.bought.length ? "Screenshot this receipt, post it in the server and tag Dym to claim your prizes." : "You didn't buy anything, so there's nothing to claim."}</p>
    ${wrong.length ? `<details class="wr"><summary>What you got wrong (${wrong.length}). Tap to show</summary>${rv}</details>` : `<div class="sh">What you got wrong</div><p>Nothing! You got every question right.</p>`}
    ${retakeHtml()}`;
  bindRetake();
}

  think: ["think","note","look","desk","chair","teach"],   // next to each question
  right: ["thumbs","party","yes"],
  half:  ["squint","scarf"],
  wrong: ["cry","torn","ragged","annoyed","wail","shock","unimpressed"],

// falling autumn leaves
(function(){
  const box = document.getElementById("leaves"); if (!box) return;
  const L = ["\u{1F342}","\u{1F341}"];
  for (let k = 0; k < 14; k++) {
    const sp = document.createElement("span");
    sp.textContent = L[k % 2];
    sp.style.left = (Math.random() * 100) + "%";
    sp.style.fontSize = (16 + Math.random() * 16) + "px";
    sp.style.animationDuration = (10 + Math.random() * 10) + "s";
    sp.style.animationDelay = (-Math.random() * 20) + "s";
    sp.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    box.appendChild(sp);
  }
})();

start();
